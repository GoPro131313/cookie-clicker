<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cookie Clicker - Advanced</title>
  <style>
    :root {
      --bg1: #f8e8bf;
      --bg2: #f2d39d;
      --panel: #fff8ee;
      --panel-border: #ca9e5b;
      --primary: #c87c2f;
      --primary-dark: #7d4413;
      --gold: #f8d66d;
      --gold-strong: #d99d12;
      --text: #3a2716;
      --success: #4a9d59;
      --danger: #a5482e;
      --shadow: rgba(72, 38, 15, 0.25);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background: radial-gradient(circle at top, #fff7dc 0%, var(--bg1) 35%, var(--bg2) 100%);
      color: var(--text);
    }

    .game {
      width: min(1200px, 100%);
      background: rgba(255, 249, 241, 0.9);
      border: 3px solid var(--panel-border);
      border-radius: 18px;
      box-shadow: 0 18px 40px var(--shadow);
      padding: 20px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.1rem, 4vw, 3.2rem);
      color: var(--primary-dark);
    }

    .stats {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .stat-box {
      background: var(--panel);
      border: 2px solid var(--panel-border);
      border-radius: 12px;
      padding: 10px 14px;
      min-width: 170px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.5);
    }

    .label {
      display: block;
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      opacity: 0.8;
    }

    .value {
      display: block;
      font-size: clamp(1.2rem, 2vw, 1.9rem);
      font-weight: bold;
      margin-top: 4px;
    }

    .content {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 20px;
    }

    .left-panel, .right-panel {
      background: var(--panel);
      border: 2px solid var(--panel-border);
      border-radius: 16px;
      padding: 18px;
    }

    .cookie-zone {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 420px;
      position: relative;
      text-align: center;
    }

    .cookie-wrap {
      position: relative;
      display: inline-flex;
      justify-content: center;
      align-items: center;
    }

    .cookie-button {
      position: relative;
      width: min(52vw, 270px);
      height: min(52vw, 270px);
      max-width: 270px;
      max-height: 270px;
      border: none;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 22%, #fff5d4, #f5bc61 36%, #d98a2b 69%, #b8691d 100%);
      box-shadow: 0 20px 25px rgba(115, 67, 20, 0.35), inset -12px -14px 0 rgba(95, 50, 13, 0.2), inset 14px 12px 0 rgba(255,255,255,0.18);
      font-size: clamp(4rem, 12vw, 7rem);
      cursor: pointer;
      user-select: none;
      transition: transform 0.10s ease, box-shadow 0.10s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      text-shadow: 0 3px 0 rgba(0,0,0,0.12);
    }

    .cookie-button:hover { transform: scale(1.02); }
    .cookie-button:active { transform: scale(0.97); }

    .cookie-button.popped {
      animation: pop 0.18s ease;
    }

    @keyframes pop {
      0% { transform: scale(1); }
      30% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }

    .floating-text {
      position: absolute;
      font-size: 1.5rem;
      font-weight: bold;
      color: var(--primary-dark);
      pointer-events: none;
      animation: floatUp 0.8s ease forwards;
      white-space: nowrap;
      z-index: 10;
    }

    @keyframes floatUp {
      0% {
        opacity: 1;
        transform: translate(-50%, 0) scale(1);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -50px) scale(1.2);
      }
    }

    .golden-cookie {
      position: absolute;
      right: 34px;
      top: 18px;
      width: 82px;
      height: 82px;
      border-radius: 50%;
      border: 2px solid #e8b220;
      background: radial-gradient(circle, #fff3a6, #f6cf47 35%, #d69d00 100%);
      box-shadow: 0 0 20px rgba(255, 202, 31, 0.8);
      display: none;
      justify-content: center;
      align-items: center;
      font-size: 2rem;
      cursor: pointer;
      animation: pulse 1.1s infinite alternate;
      z-index: 5;
    }

    @keyframes pulse {
      from { transform: scale(1); }
      to { transform: scale(1.08); }
    }

    .golden-cookie.visible { display: flex; }

    .shop {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .shop h2, .notes h2 {
      margin: 0 0 12px;
      color: var(--primary-dark);
      font-size: 1.5rem;
    }

    .upgrade-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .upgrade-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: #fffaf2;
      border: 2px solid var(--panel-border);
      border-radius: 12px;
      padding: 12px;
      transition: background 0.2s ease;
    }

    .upgrade-card:hover { background: #fff4dc; }

    .upgrade-text {
      flex: 1;
      min-width: 0;
    }

    .upgrade-name {
      display: block;
      font-weight: bold;
      font-size: 1.03rem;
    }

    .upgrade-desc {
      display: block;
      font-size: 0.8rem;
      opacity: 0.82;
      margin-top: 3px;
      line-height: 1.35;
    }

    .upgrade-meta {
      display: block;
      font-size: 0.75rem;
      opacity: 0.8;
      margin-top: 4px;
    }

    .upgrade-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .owned-badge {
      min-width: 34px;
      text-align: center;
      font-weight: bold;
      color: var(--success);
    }

    .buy-button {
      background: linear-gradient(#efc762, #d99a2f);
      border: 2px solid #b77a18;
      color: var(--text);
      border-radius: 10px;
      padding: 8px 12px;
      font-weight: bold;
      cursor: pointer;
      min-width: 96px;
      transition: transform 0.12s ease, filter 0.12s ease;
    }

    .buy-button:hover:not(:disabled) {
      filter: brightness(1.06);
      transform: translateY(-1px);
    }

    .buy-button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .notes {
      margin-top: 20px;
    }

    .notes p {
      margin: 0;
      line-height: 1.5;
      font-size: 1rem;
    }

    .reset-btn {
      margin-top: 16px;
      background: #f6d3b8;
      border: 2px solid #d48c66;
      color: var(--text);
      border-radius: 10px;
      padding: 10px 14px;
      font-weight: bold;
      cursor: pointer;
    }

    @media (max-width: 820px) {
      .content { grid-template-columns: 1fr; }
      .cookie-zone { min-height: 300px; }
      .golden-cookie { right: 10px; top: 10px; width: 68px; height: 68px; }
    }
  </style>
</head>
<body>
  <div class="game">
    <div class="topbar">
      <h1>Cookie Clicker</h1>

      <div class="stats">
        <div class="stat-box">
          <span class="label">Cookies</span>
          <span class="value" id="cookiesDisplay">0</span>
        </div>
        <div class="stat-box">
          <span class="label">Per Second</span>
          <span class="value" id="cpsDisplay">0.0</span>
        </div>
        <div class="stat-box">
          <span class="label">Click Power</span>
          <span class="value" id="clickDisplay">1.0</span>
        </div>
        <div class="stat-box">
          <span class="label">Total Baked</span>
          <span class="value" id="totalDisplay">0</span>
        </div>
      </div>
    </div>

    <div class="content">
      <div class="left-panel">
        <div class="cookie-zone">
          <div class="cookie-wrap">
            <button id="cookieButton" class="cookie-button" aria-label="Bake a cookie">🍪</button>
            <button id="goldenCookie" class="golden-cookie" aria-label="Golden cookie bonus">✨</button>
          </div>
          <div id="statusText" style="margin-top: 14px; font-weight: bold; font-size:1.05rem;">
            Click the cookie to begin baking!
          </div>
        </div>
      </div>

      <div class="right-panel">
        <div class="shop">
          <h2>Bakery Upgrades</h2>
          <div id="upgradeList" class="upgrade-list"></div>
        </div>

        <div class="notes">
          <h2>Strategy</h2>
          <p>Build passive income, buy multipliers, and catch golden cookies for bursts of production.</p>
          <button id="resetButton" class="reset-btn">Reset Save</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "cookie-clicker-advanced-v1";

    const state = {
      cookies: 0,
      totalCookies: 0,
      lastTick: Date.now(),
      productionMultiplier: 1,
      clickMultiplier: 1,
      prodBoostTimer: 0,
      clickBoostTimer: 0,
      goldenCookieVisible: false,
      goldenCookieTimer: 9,
      goldenCookieLife: 0,
      upgrades: [
        // Buildings
        { id: "cursor", type: "building", name: "Cursor", baseCost: 15, cost: 15, count: 0, cps: 0.1, costScale: 1.15, description: "A tiny helper who clicks cookies." },
        { id: "grandma", type: "building", name: "Grandma", baseCost: 100, cost: 100, count: 0, cps: 1, costScale: 1.15, description: "Grandma makes warm, buttery batches." },
        { id: "oven", type: "building", name: "Oven", baseCost: 500, cost: 500, count: 0, cps: 5, costScale: 1.17, description: "Constant cookie output from a hot oven." },
        { id: "farm", type: "building", name: "Farm", baseCost: 2000, cost: 2000, count: 0, cps: 18, costScale: 1.17, description: "Grows sugar and wheat for bakin'." },
        { id: "factory", type: "building", name: "Factory", baseCost: 8000, cost: 8000, count: 0, cps: 45, costScale: 1.18, description: "Industrial cookie production." },
        { id: "mine", type: "building", name: "Mine", baseCost: 32000, cost: 32000, count: 0, cps: 120, costScale: 1.18, description: "Digs up pure cookie ore." },
        { id: "portal", type: "building", name: "Portal", baseCost: 150000, cost: 150000, count: 0, cps: 450, costScale: 1.2, description: "A warp gate to a cookie dimension." },
        { id: "timeMachine", type: "building", name: "Time Machine", baseCost: 700000, cost: 700000, count: 0, cps: 1500, costScale: 1.22, description: "Reverses time to bake more cookies." },

        // One-time or limited boosts
        { id: "reinforcedFingers", type: "boost", name: "Reinforced Fingers", baseCost: 100, cost: 100, count: 0, maxCount: 1, clickBonus: 0.5, description: "Adds +50% click power permanently." },
        { id: "doubleBake", type: "boost", name: "Double Bake", baseCost: 600, cost: 600, count: 0, maxCount: 1, clickBonus: 1.0, description: "Doubles your cookie clicks permanently." },
        { id: "sugarRush", type: "boost", name: "Sugar Rush", baseCost: 1200, cost: 1200, count: 0, maxCount: 1, prodBonus: 0.5, description: "Adds +50% production permanently." },
        { id: "goldenCookieLuck", type: "boost", name: "Golden Cookie Luck", baseCost: 5000, cost: 5000, count: 0, maxCount: 1, goldenChance: 0.25, description: "More frequent golden cookie bonus events." }
      ]
    };

    const cookieButton = document.getElementById("cookieButton");
    const goldenCookieButton = document.getElementById("goldenCookie");
    const cookiesDisplay = document.getElementById("cookiesDisplay");
    const cpsDisplay = document.getElementById("cpsDisplay");
    const clickDisplay = document.getElementById("clickDisplay");
    const totalDisplay = document.getElementById("totalDisplay");
    const upgradeList = document.getElementById("upgradeList");
    const statusText = document.getElementById("statusText");
    const resetButton = document.getElementById("resetButton");

    function formatNumber(value) {
      if (value >= 1_000_000_000) return (value / 1_000_000_000).toFixed(2) + "B";
      if (value >= 1_000_000) return (value / 1_000_000).toFixed(2) + "M";
      if (value >= 1_000) return (value / 1_000).toFixed(2) + "K";
      return Number.isInteger(value) ? value.toLocaleString() : value.toFixed(1);
    }

    function getUpgradeCost(upgrade) {
      if (upgrade.type === "boost" && upgrade.count >= (upgrade.maxCount || 1)) return Infinity;
      return Math.floor(upgrade.baseCost * Math.pow(upgrade.costScale || 1.15, upgrade.count));
    }

    function getBuildingCps() {
      return state.upgrades
        .filter(u => u.type === "building")
        .reduce((sum, upgrade) => sum + (upgrade.count * upgrade.cps), 0);
    }

    function getClickPower() {
      let power = 1;

      state.upgrades.forEach(up => {
        if (up.type === "boost") {
          if (up.clickBonus) power += up.clickBonus * up.count;
          if (up.id === "doubleBake" && up.count > 0) power *= 2;
        }
      });

      if (state.clickBoostTimer > 0) power *= 2;
      return power;
    }

    function getProductionMultiplier() {
      let multiplier = 1;

      state.upgrades.forEach(up => {
        if (up.type === "boost") {
          if (up.prodBonus) multiplier += up.prodBonus * up.count;
        }
      });

      if (state.prodBoostTimer > 0) multiplier *= 2;
      return multiplier;
    }

    function getTotalCps() {
      return getBuildingCps() * getProductionMultiplier();
    }

    function saveGame() {
      try {
        const data = {
          cookies: state.cookies,
          totalCookies: state.totalCookies,
          productionMultiplier: state.productionMultiplier,
          clickMultiplier: state.clickMultiplier,
          prodBoostTimer: state.prodBoostTimer,
          clickBoostTimer: state.clickBoostTimer,
          goldenCookieVisible: state.goldenCookieVisible,
          goldenCookieTimer: state.goldenCookieTimer,
          goldenCookieLife: state.goldenCookieLife,
          upgrades: state.upgrades.map(u => ({
            id: u.id,
            count: u.count
          }))
        };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      } catch (err) {
        console.error("Save failed", err);
      }
    }

    function loadGame() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;

        const data = JSON.parse(raw);
        if (!data || typeof data !== "object") return;

        state.cookies = Number(data.cookies) || 0;
        state.totalCookies = Number(data.totalCookies) || 0;
        state.productionMultiplier = Number(data.productionMultiplier) || 1;
        state.clickMultiplier = Number(data.clickMultiplier) || 1;
        state.prodBoostTimer = Number(data.prodBoostTimer) || 0;
        state.clickBoostTimer = Number(data.clickBoostTimer) || 0;
        state.goldenCookieVisible = Boolean(data.goldenCookieVisible);
        state.goldenCookieTimer = Number(data.goldenCookieTimer) || 9;
        state.goldenCookieLife = Number(data.goldenCookieLife) || 0;

        if (Array.isArray(data.upgrades)) {
          data.upgrades.forEach(saved => {
            const upgrade = state.upgrades.find(u => u.id === saved.id);
            if (upgrade) {
              upgrade.count = Number(saved.count) || 0;
            }
          });
        }
      } catch (err) {
        console.error("Load failed", err);
      }
    }

    function triggerFloatingText(text, x = 50, y = 50) {
      const floating = document.createElement("div");
      floating.className = "floating-text";
      floating.textContent = text;
      floating.style.left = `${x}%`;
      floating.style.top = `${y}%`;
      cookieButton.appendChild(floating);
      setTimeout(() => floating.remove(), 700);
    }

    function buyUpgrade(id) {
      const upgrade = state.upgrades.find(u => u.id === id);
      if (!upgrade) return;

      const cost = getUpgradeCost(upgrade);
      if (!Number.isFinite(cost) || state.cookies < cost) return;

      state.cookies -= cost;
      upgrade.count += 1;
      upgrade.cost = getUpgradeCost(upgrade);

      if (upgrade.type === "boost") {
        if (upgrade.id === "reinforcedFingers") {
          statusText.textContent = "Reinforced Fingers unlocked! +50% click power.";
        } else if (upgrade.id === "doubleBake") {
          statusText.textContent = "Double Bake unlocked! Clicks are doubled.";
        } else if (upgrade.id === "sugarRush") {
          statusText.textContent = "Sugar Rush unlocked! Production got sweeter.";
        } else if (upgrade.id === "goldenCookieLuck") {
          statusText.textContent = "Golden cookie luck increased.";
        }
      } else {
        statusText.textContent = `${upgrade.name} purchased!`;
      }

      saveGame();
      render();
    }

    function clickCookie() {
      const clickPower = getClickPower();
      const earned = clickPower;
      state.cookies += earned;
      state.totalCookies += earned;

      cookieButton.classList.remove("popped");
      void cookieButton.offsetWidth;
      cookieButton.classList.add("popped");

      triggerFloatingText(`+${formatNumber(earned)}`, 50, 48);

      saveGame();
      render();
    }

    function spawnGoldenCookie() {
      if (state.goldenCookieVisible) return;

      state.goldenCookieVisible = true;
      state.goldenCookieLife = 7;
      goldenCookieButton.classList.add("visible");
      statusText.textContent = "Golden cookie! Click it for a huge bonus!";
    }

    function consumeGoldenCookie() {
      if (!state.goldenCookieVisible) return;

      const bonus = Math.max(50, Math.floor(state.totalCookies * 0.2) + 100);
      state.cookies += bonus;
      state.totalCookies += bonus;

      state.prodBoostTimer = 18;
      state.clickBoostTimer = 12;

      goldenCookieButton.classList.remove("visible");
      state.goldenCookieVisible = false;
      state.goldenCookieLife = 0;
      state.goldenCookieTimer = 12 + Math.random() * 14;

      triggerFloatingText(`✨ +${formatNumber(bonus)}`, 50, 48);
      statusText.textContent = "Golden cookie burst! Production and clicking boosted!";

      saveGame();
      render();
    }

    function renderUpgrades() {
      upgradeList.innerHTML = "";
      state.upgrades.forEach(upgrade => {
        const cost = getUpgradeCost(upgrade);
        const isMaxed = !Number.isFinite(cost);

        const card = document.createElement("div");
        card.className = "upgrade-card";

        const actionArea = document.createElement("div");
        actionArea.className = "upgrade-actions";

        const owned = document.createElement("span");
        owned.className = "owned-badge";
        owned.textContent = `x${upgrade.count}`;

        const button = document.createElement("button");
        button.className = "buy-button";
        button.disabled = state.cookies < cost || isMaxed;
        button.textContent = isMaxed ? "MAX" : formatNumber(cost);

        button.addEventListener("click", () => buyUpgrade(upgrade.id));

        actionArea.appendChild(owned);
        actionArea.appendChild(button);

        const text = document.createElement("div");
        text.className = "upgrade-text";
        text.innerHTML = `
          <span class="upgrade-name">${upgrade.name}</span>
          <span class="upgrade-desc">${upgrade.description}</span>
          <span class="upgrade-meta">${upgrade.type === "building" ? `+${formatNumber(upgrade.cps)} / sec` : (upgrade.clickBonus ? `Click +${upgrade.clickBonus * 100}%` : (upgrade.prodBonus ? `Production +${upgrade.prodBonus * 100}%` : "One-time boost"))}</span>
        `;

        card.appendChild(text);
        card.appendChild(actionArea);
        upgradeList.appendChild(card);
      });
    }

    function render() {
      const cps = getTotalCps();
      const clickPower = getClickPower();

      cookiesDisplay.textContent = formatNumber(state.cookies);
      cpsDisplay.textContent = formatNumber(cps);
      clickDisplay.textContent = formatNumber(clickPower);
      totalDisplay.textContent = formatNumber(state.totalCookies);

      renderUpgrades();
    }

    function gameLoop() {
      const now = Date.now();
      const dt = (now - state.lastTick) / 1000;
      state.lastTick = now;

      if (state.prodBoostTimer > 0) {
        state.prodBoostTimer = Math.max(0, state.prodBoostTimer - dt);
      }

      if (state.clickBoostTimer > 0) {
        state.clickBoostTimer = Math.max(0, state.clickBoostTimer - dt);
      }

      if (!state.goldenCookieVisible) {
        state.goldenCookieTimer -= dt;
        if (state.goldenCookieTimer <= 0) {
          spawnGoldenCookie();
        }
      } else {
        state.goldenCookieLife -= dt;
        if (state.goldenCookieLife <= 0) {
          goldenCookieButton.classList.remove("visible");
          state.goldenCookieVisible = false;
          state.goldenCookieTimer = 10 + Math.random() * 12;
          statusText.textContent = "Golden cookie faded. Keep baking!";
        }
      }

      const cps = getTotalCps();
      state.cookies += cps * dt;
      state.totalCookies += cps * dt;

      render();
      saveGame();
      requestAnimationFrame(gameLoop);
    }

    function resetSave() {
      const confirmed = confirm("Reset your cookie progress?");
      if (!confirmed) return;

      localStorage.removeItem(STORAGE_KEY);

      state.cookies = 0;
      state.totalCookies = 0;
      state.lastTick = Date.now();
      state.productionMultiplier = 1;
      state.clickMultiplier = 1;
      state.prodBoostTimer = 0;
      state.clickBoostTimer = 0;
      state.goldenCookieVisible = false;
      state.goldenCookieTimer = 9;
      state.goldenCookieLife = 0;

      state.upgrades.forEach(upgrade => {
        upgrade.count = 0;
        upgrade.cost = upgrade.baseCost;
      });

      statusText.textContent = "Save reset. Fresh bakery started!";
      goldenCookieButton.classList.remove("visible");
      render();
      saveGame();
    }

    cookieButton.addEventListener("click", clickCookie);
    goldenCookieButton.addEventListener("click", consumeGoldenCookie);
    resetButton.addEventListener("click", resetSave);

    loadGame();
    render();
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
